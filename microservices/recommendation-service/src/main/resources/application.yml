spring:
  application:
    name: recommendation
  config:
    import: "configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  cloud:
    config:
      fail-fast: true
      username: ${CONFIG_SERVER_USR}
      password: ${CONFIG_SERVER_PWD}
      retry:
        initial-interval: 3000
        multiplier: 1.3
        max-interval: 10000
        max-attempts: 20

---
spring:
  config:
    activate:
      on-profile: docker
    import: "configserver:${CONFIG_SERVER_URL:http://config-server:8888}"
