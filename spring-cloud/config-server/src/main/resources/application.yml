server:
  port: 8888

spring:
  application:
    name: config-server
  cloud:
    config:
      server:
        git:
          # Public configuration repository. For private repos, inject credentials
          # from the environment; never commit access tokens.
          uri: ${CONFIG_GIT_URI:https://github.com/kakarot987/config-repo.git}
          username: ${CONFIG_GIT_USERNAME:}
          password: ${CONFIG_GIT_TOKEN:}
          skipSslValidation: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
