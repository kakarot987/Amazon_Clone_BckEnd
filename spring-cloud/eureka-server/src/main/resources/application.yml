spring:
  application:
    name: eureka-server
  profiles:
    active: native

---
spring:
  config:
    import: "configserver:http://localhost:8888"
    activate:
      on-profile: native
  cloud:
    config:
      failFast: true
      retry:
        initialInterval: 3000
        multiplier: 1.3
        maxInterval: 10000
        maxAttempts: 20
      uri: http://localhost:8888
      username: root
      password: root

management:
  security:
    enabled: false

---

spring:
  config:
    import: "configserver:http://config-server:8888"
    activate:
      on-profile: docker
  cloud:
    config:
      failFast: true
      retry:
        initialInterval: 3000
        multiplier: 1.3
        maxInterval: 10000
        maxAttempts: 20
      uri:  http://config-server:8888
      username: root
      password: root