server:
  port: 9999

spring:
  application:
    name: auth-server
  config:
    import: "configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  cloud:
    config:
      fail-fast: true
      username: ${CONFIG_SERVER_USR}
      password: ${CONFIG_SERVER_PWD}
      retry:
        initial-interval: 3000
        multiplier: 1.3
        max-interval: 10000
        max-attempts: 20

# Identity store is in-memory by default; opt in explicitly to JDBC.
auth:
  identity:
    store: ${AUTH_IDENTITY_STORE:demo}

---
spring:
  config:
    activate:
      on-profile: docker
    import: "configserver:${CONFIG_SERVER_URL:http://config-server:8888}"

