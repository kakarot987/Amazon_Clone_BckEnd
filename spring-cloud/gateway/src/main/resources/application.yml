spring:
  application:
    name: gateway
  profiles:
    active: native

---
spring:
  config:
    import: "configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
    activate:
      on-profile: native
  cloud:
    config:
      failFast: true
      retry:
        initialInterval: 3000
        multiplier: 1.3
        maxInterval: 10000
        maxAttempts: 20
      uri: http://localhost:8888
      username: ${CONFIG_SERVER_USR}
      password: ${CONFIG_SERVER_PWD}

management:
  security:
    enabled: false

---

spring:
  config:
    import: "configserver:${CONFIG_SERVER_URL:http://config-server:8888}"
    activate:
      on-profile: docker
  cloud:
    config:
      failFast: true
      retry:
        initialInterval: 3000
        multiplier: 1.3
        maxInterval: 10000
        maxAttempts: 20
      uri:  http://config-server:8888
      username: ${CONFIG_SERVER_USR}
      password: ${CONFIG_SERVER_PWD}
spring.security.oauth2.resourceserver.jwt.issuer-uri: ${AUTH_ISSUER_URI:http://auth-server:9999}
