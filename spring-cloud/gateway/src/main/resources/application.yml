server:
  port: 8443

spring:
  application:
    name: gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH_ISSUER_URI:http://auth-server:9999}
  config:
    import: "configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  cloud:
    config:
      fail-fast: true
      username: ${CONFIG_SERVER_USR}
      password: ${CONFIG_SERVER_PWD}
      retry:
        initial-interval: 3000
        multiplier: 1.3
        max-interval: 10000
        max-attempts: 20

---
spring:
  config:
    activate:
      on-profile: docker
    import: "configserver:${CONFIG_SERVER_URL:http://config-server:8888}"

# Single-instance, authenticated composite-write throttle; not a distributed rate limiter.
app:
  gateway:
    write-rate-limit:
      per-minute: ${GATEWAY_WRITE_RATE_LIMIT_PER_MINUTE:60}
      max-callers: ${GATEWAY_WRITE_RATE_LIMIT_MAX_CALLERS:10000}
