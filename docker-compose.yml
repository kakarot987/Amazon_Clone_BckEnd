services:
  mongodb:
    image: mongo:6.0
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    networks: [backend]
    volumes: [mongo-data:/data/db]
    # Initialize the one-node replica set once, then wait for PRIMARY election.
    # The internal hostname must match what the Java drivers can resolve.
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'try { rs.status().myState === 1 } catch (e) { rs.initiate({_id: \"rs0\", members: [{_id: 0, host: \"mongodb:27017\"}]}); false }' | grep -q true"]
      interval: 10s
      timeout: 6s
      retries: 20

  mysql:
    image: mysql:8.0
    networks: [backend]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: review-db
      MYSQL_USER: user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
    volumes: [mysql-data:/var/lib/mysql]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management
    networks: [backend]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?Set RABBITMQ_USER in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 15

  config-server:
    build: spring-cloud/config-server
    networks: [backend]
    environment:
      CONFIG_GIT_URI: ${CONFIG_GIT_URI:-https://github.com/kakarot987/config-repo.git}
      CONFIG_GIT_USERNAME: ${CONFIG_GIT_USERNAME:-}
      CONFIG_GIT_TOKEN: ${CONFIG_GIT_TOKEN:-}
      SPRING_SECURITY_USER_NAME: ${CONFIG_SERVER_USR:?Set CONFIG_SERVER_USR in .env}
      SPRING_SECURITY_USER_PASSWORD: ${CONFIG_SERVER_PWD:?Set CONFIG_SERVER_PWD in .env}
    ports: ["127.0.0.1:8888:8888"]

  eureka:
    build: spring-cloud/eureka-server
    networks: [backend]
    environment: &service-env
      SPRING_PROFILES_ACTIVE: docker
      CONFIG_SERVER_URL: http://config-server:8888
      CONFIG_SERVER_USR: ${CONFIG_SERVER_USR:?Set CONFIG_SERVER_USR in .env}
      CONFIG_SERVER_PWD: ${CONFIG_SERVER_PWD:?Set CONFIG_SERVER_PWD in .env}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:?Set RABBITMQ_USER in .env}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
      APP_EUREKA_USERNAME: ${EUREKA_USER:?Set EUREKA_USER in .env}
      APP_EUREKA_PASSWORD: ${EUREKA_PASSWORD:?Set EUREKA_PASSWORD in .env}
    depends_on: [config-server]
    ports: ["127.0.0.1:8761:8761"]

  auth-server:
    build: spring-cloud/authorization-server
    networks: [backend]
    environment:
      <<: *service-env
      AUTH_WRITER_CLIENT_SECRET: ${AUTH_WRITER_CLIENT_SECRET:?Set AUTH_WRITER_CLIENT_SECRET in .env}
      AUTH_READER_CLIENT_SECRET: ${AUTH_READER_CLIENT_SECRET:?Set AUTH_READER_CLIENT_SECRET in .env}
      AUTH_DEMO_USER: ${AUTH_DEMO_USER:?Set AUTH_DEMO_USER in .env}
      AUTH_DEMO_PASSWORD: ${AUTH_DEMO_PASSWORD:?Set AUTH_DEMO_PASSWORD in .env}
      AUTH_FULFILLMENT_CLIENT_SECRET: ${AUTH_FULFILLMENT_CLIENT_SECRET:?Set AUTH_FULFILLMENT_CLIENT_SECRET in .env}
      AUTH_RETURNS_CLIENT_SECRET: ${AUTH_RETURNS_CLIENT_SECRET:?Set AUTH_RETURNS_CLIENT_SECRET in .env}
      AUTH_MODERATOR_CLIENT_SECRET: ${AUTH_MODERATOR_CLIENT_SECRET:?Set AUTH_MODERATOR_CLIENT_SECRET in .env}
    depends_on: [config-server, eureka]

  product:
    build: microservices/product-service
    networks: [backend]
    environment:
      <<: *service-env
      SERVER_PORT: 8080
      APP_RECEIPT_PROBE_SECRET: ${APP_RECEIPT_PROBE_SECRET:?Set APP_RECEIPT_PROBE_SECRET in .env}
      SPRING_DATA_MONGODB_HOST: mongodb
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/product-db?replicaSet=rs0
      MOCK_PAYMENT_WEBHOOK_SECRET: ${MOCK_PAYMENT_WEBHOOK_SECRET:?Set MOCK_PAYMENT_WEBHOOK_SECRET in .env}
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,prometheus
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: 0.1
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin-server:9411/api/v2/spans
    depends_on: [config-server, mongodb, rabbitmq, eureka]

  recommendation:
    build: microservices/recommendation-service
    networks: [backend]
    environment:
      <<: *service-env
      SERVER_PORT: 8080
      APP_RECEIPT_PROBE_SECRET: ${APP_RECEIPT_PROBE_SECRET:?Set APP_RECEIPT_PROBE_SECRET in .env}
      SPRING_DATA_MONGODB_HOST: mongodb
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/recommendation-db?replicaSet=rs0
    depends_on: [config-server, mongodb, rabbitmq, eureka]

  review:
    build: microservices/review-service
    networks: [backend]
    environment:
      <<: *service-env
      SERVER_PORT: 8080
      APP_RECEIPT_PROBE_SECRET: ${APP_RECEIPT_PROBE_SECRET:?Set APP_RECEIPT_PROBE_SECRET in .env}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql/review-db
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
    depends_on: [config-server, mysql, rabbitmq, eureka]

  product-composite:
    build: microservices/product-composite-service
    networks: [backend]
    environment:
      <<: *service-env
      SERVER_PORT: 8080
      APP_RECEIPT_PROBE_SECRET: ${APP_RECEIPT_PROBE_SECRET:?Set APP_RECEIPT_PROBE_SECRET in .env}
      APP_SAGA_ENABLED: ${APP_SAGA_ENABLED:-false}
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/composite-outbox-db?replicaSet=rs0
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,prometheus
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: 0.1
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin-server:9411/api/v2/spans
    depends_on: [config-server, mongodb, rabbitmq, product, recommendation, review, auth-server]

  gateway:
    build: spring-cloud/gateway
    networks: [backend]
    environment:
      <<: *service-env
      GATEWAY_WRITE_RATE_LIMIT_PER_MINUTE: ${GATEWAY_WRITE_RATE_LIMIT_PER_MINUTE:-60}
      GATEWAY_WRITE_RATE_LIMIT_MAX_CALLERS: ${GATEWAY_WRITE_RATE_LIMIT_MAX_CALLERS:-10000}
    ports: ["127.0.0.1:8443:8443"]
    depends_on: [config-server, eureka, auth-server, product-composite]

  prometheus:
    image: prom/prometheus:v2.55.1
    networks: [backend]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--web.enable-lifecycle=false"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/rules.yml:/etc/prometheus/rules.yml:ro
      - prometheus-data:/prometheus
    ports: ["127.0.0.1:9090:9090"]
    depends_on: [product, product-composite]

  grafana:
    image: grafana/grafana:11.3.1
    networks: [backend]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?Set GRAFANA_ADMIN_USER in .env}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports: ["127.0.0.1:3000:3000"]
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on: [prometheus]

  zipkin-server:
    image: openzipkin/zipkin:2.24
    networks: [backend]
    ports: ["127.0.0.1:9411:9411"]

networks:
  backend:
    name: my-network

volumes:
  mongo-data:
  mysql-data:
  prometheus-data:
  grafana-data:
