  rabbitmq:
    image: rabbitmq:3.11.8-management
    mem_limit: 512m
    networks:
      - my-network
    ports:
      - 5672:5672
      - 15672:15672
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 5s
      timeout: 2s
      retries: 60


  config-server:
    build: spring-cloud/config-server
    mem_limit: 512m
    networks:
      - my-network
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - ENCRYPT_KEY=my-very-secure-encrypt-key
      - SPRING_SECURITY_USER_NAME=root
      - SPRING_SECURITY_USER_PASSWORD=root
    volumes:
      - $PWD/config-repo:/config-repo
    ports:
      - "8888:8888"


  eureka:
    build: spring-cloud/eureka-server
    mem_limit: 512m
    networks:
      - my-network
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - ENCRYPT_KEY=my-very-secure-encrypt-key
      - CONFIG_SERVER_USR=root
      - CONFIG_SERVER_PWD=root
    ports:
      - "8761:8761"

  gateway:
    build: spring-cloud/gateway
    mem_limit: 512m
    networks:
      - my-network
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - CONFIG_SERVER_USR=root
      - CONFIG_SERVER_PWD=root
    ports:
      - "8443:8443"
#    depends_on:
#      auth-server:
#        condition: service_healthy

  auth-server:
    build: spring-cloud/authorization-server
    mem_limit: 512m
    networks:
      - my-network
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - ENCRYPT_KEY=my-very-secure-encrypt-key
      - CONFIG_SERVER_USR=root
      - CONFIG_SERVER_PWD=root
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9999/actuator/health"]
      interval: 5s
      timeout: 2s
      retries: 60



  zipkin-server:
    image: openzipkin/zipkin:2.24.0
    restart: always
    mem_limit: 1024m
    networks:
      - my-network
    environment:
      - STORAGE_TYPE=mem
    ports:
      - 9411:9411

networks:
  my-network:
    name: my-network