global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: commerce-product
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['product:8080']
  - job_name: commerce-composite
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['product-composite:8080']
