server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;

    # The gateway's health endpoint is /actuator/health.
    location = /api/health {
        proxy_pass http://gateway:8443/actuator/health;
        proxy_http_version 1.1;
        proxy_set_header Host gateway;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        proxy_buffering off;
        add_header Cache-Control "no-store" always;
    }

    # Remove /api prefix; bearer tokens travel only to the internal gateway.
    location /api/ {
        proxy_pass http://gateway:8443/;
        proxy_http_version 1.1;
        proxy_set_header Host gateway;
        proxy_connect_timeout 5s;
        proxy_read_timeout 25s;
        proxy_buffering off;
        client_max_body_size 256k;
        add_header Cache-Control "no-store" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
